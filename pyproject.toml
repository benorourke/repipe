[project]
name = "repipe"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "frozendict>=2.4.7",
    "lightgbm>=4.7.0",
    "polars>=1.44.2",
    "pydantic>=2.13.5",
    "typer>=0.27.2",
]

[project.scripts]
repipe = "repipe.cli.cli:app"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
include = ["repipe*"]

[tool.pyright]
exclude = ["build"]
